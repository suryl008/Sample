<mat-form-field appearance="outline" class="shared-dropdown-field w-100">
  <mat-label>{{ selectedText }}</mat-label>
  <mat-select
    [(ngModel)]="internalSelection"
    [multiple]="isMultiSelectDropdown"
    [disabled]="isDisable"
    [compareWith]="compareObjects"
    (selectionChange)="onSelectionChange()">

    <!-- Live Search Filter Input Row -->
    <div class="dropdown-search-container">
      <input 
        type="text" 
        placeholder="Search options..." 
        class="dropdown-search-input"
        (input)="filterDropdownValues($any($event.target).value)"
        (keydown)="$event.stopPropagation()">
    </div>

    <!-- Master Header Toggle Row (Kept out of mat-option list to prevent calculation bugs) -->
    <div 
      *ngIf="isMultiSelectDropdown && dropdownListValue?.length" 
      class="master-toggle-row"
      (click)="toggleSelectAll($event)">
      <div class="custom-checkbox-box" [class.is-checked]="isAllSelected()">
        <span class="checkmark-icon" *ngIf="isAllSelected()">✓</span>
      </div>
      <span class="toggle-text">
        {{ isAllSelected() ? 'UnSelect All' : 'Select All' }}
      </span>
    </div>

    <!-- Main Dynamic Material Options List -->
    <mat-option
      *ngFor="let item of dropdownListValue"
      [value]="item"
      [style.display]="isItemVisible(item) ? null : 'none'">
      <span class="option-label">{{ item.itemName || item.name }}</span>
    </mat-option>

    <!-- Empty/No Matches State Feedback Row -->
    <mat-option *ngIf="!hasVisibleItems" disabled class="no-data-option">
      No items found
    </mat-option>
  </mat-select>
</mat-form-field>
