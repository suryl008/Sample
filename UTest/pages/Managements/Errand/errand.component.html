<div class="spinner" *ngIf="showSpinner">
    <div class="fa-3x">
        <i class="fa fa-spinner fa-spin"></i>
    </div>
</div>
<div>
    <mat-card>
        <div class="row" style="display: flex;">
            <div class="col-lg-12">
                <mat-accordion class="example-headers-align" multi>
                    <mat-expansion-panel [expanded]="true">
                        <mat-expansion-panel-header #panelSearch>
                            <mat-panel-title>
                                <div class="row" style="width: 100%;">
                                    <div class="col-lg-5">
                                        <span class="mat-panel-title-span">Errand Management</span>
                                    </div>
                                    <div class="col-lg-7" style="text-align: right;">
                                        <button class="mt-1 cursor" mat-button style="color: #bd3640;"
                                            (click)="panelSearch._toggle(); saveOrUpdate()">
                                            <mat-icon class="mr-10">save</mat-icon>
                                            <span class="mt-20">Save</span>
                                        </button>
                                    </div>
                                </div>
                            </mat-panel-title>
                        </mat-expansion-panel-header>

                        <div class="col-lg-12 mt-2" *ngIf="!isAddOrEdit">
                            <mat-card-content class="user-table-height">
                                <div class="table-responsive">
                                    <table mat-table [dataSource]="responseData" class="tbl-width">
                                        <ng-container matColumnDef="action">
                                            <th mat-header-cell *matHeaderCellDef>Action</th>
                                            <td mat-cell *matCellDef="let element">
                                                <mat-icon title="Edit" class="cursor me-2"
                                                    (click)="addOrEditErrand(element, true)">edit</mat-icon>
                                                <mat-icon title="Edit" class="cursor me-2">delete</mat-icon>
                                                <mat-icon title="Schedule" class="cursor me-2"
                                                    (click)="openErrandSchedules(element)">schedule</mat-icon>
                                            </td>
                                        </ng-container>
                                        <ng-container *ngFor="let data of matColumnConfig; let i = index"
                                            matColumnDef="{{data.id}}">
                                            <th style="min-width: 60px;" mat-header-cell *matHeaderCellDef>{{data.name}}
                                            </th>
                                            <td mat-cell *matCellDef="let element; let j = index">
                                                <textarea [disabled]="true" *ngIf="data.id === 'emailTemplate'" rows="4"
                                                    cols="80" [value]="element[data.id]"
                                                    [(ngModel)]="element[data.id]"></textarea>
                                                <span *ngIf="data.id != 'emailTemplate'">{{element[data.id]}}</span>
                                            </td>
                                        </ng-container>

                                        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                                        <tr mat-row *matNoDataRow>
                                            <td [attr.colspan]="displayedColumns.length"> No data
                                                matching the filter.</td>
                                        </tr>
                                    </table>
                                </div>
                                <mat-paginator #paginator [pageSizeOptions]="[5,10, 15, 20]"
                                    showFirstLastButtons></mat-paginator>
                            </mat-card-content>
                        </div>
                        <div class="row mt-2" *ngIf="isAddOrEdit">
                            <ng-container *ngFor="let details of matColumnConfig">
                                <div class="col-3 mb-1" *ngIf="details.id != 'emailTemplate'">
                                    <mat-form-field>
                                        <mat-label>{{details.name}}</mat-label>
                                        <mat-label class="mandatory" *ngIf="details.id == 'errandName'">*</mat-label>
                                        <input matInput autocomplete="off"
                                            [disabled]="details.id == 'errandId' || details.id == 'lastUpdDt'"
                                            [(ngModel)]="errandDetails[details.id]">
                                    </mat-form-field>
                                </div>
                                <div class="row mb-2" *ngIf="details.id == 'emailTemplate'">
                                    <mat-label>{{details.name}}</mat-label>
                                    <ckeditor [config]="ckeConfig" debounce="500"
                                        [(ngModel)]="errandDetails[details.id]"></ckeditor>
                                </div>
                            </ng-container>

                        </div>
                    </mat-expansion-panel>
                </mat-accordion>

            </div>
        </div>
    </mat-card>
</div>
