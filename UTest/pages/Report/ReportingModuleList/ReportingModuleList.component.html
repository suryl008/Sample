<div class="spinner" *ngIf="showSpinner">
  <div class="fa-3x">
    <i class="fa fa-spinner fa-spin"></i>
  </div>
</div>

<div class="reporting-search">
  <mat-card>
    <mat-accordion multi>
      <mat-expansion-panel [expanded]="true">
        <mat-expansion-panel-header #panelSearch>
          <mat-panel-title>
            <span class="reporting-search-title">Reporting Module Search</span>
            <button type="button" mat-stroked-button class="reporting-add"
              (click)="panelSearch._toggle();openAddorEditReportingModule('add')">
              <mat-icon>add</mat-icon>
              Add New Report
            </button>
          </mat-panel-title>
        </mat-expansion-panel-header>

        <div class="reporting-search-grid">
          <mat-form-field appearance="outline">
            <mat-label>Search Program</mat-label>
            <input matInput [matAutocomplete]="program" [(ngModel)]="searchPayloadData.grantPgmDesc"
              placeholder="Min 3 characters" />
            <button type="button" matSuffix mat-icon-button aria-label="Clear" (click)="clearAutoSelect('program')">
              <mat-icon>close</mat-icon>
            </button>
            <mat-icon matSuffix>search</mat-icon>
            <mat-autocomplete #program="matAutocomplete" panelClass="reporting-overlay">
              <mat-option *ngFor="let program of progReviewTypeList"
                (onSelectionChange)="changeProgramName(program, $event)"
                [value]="program.grantPgmDesc + ' ('+ program.grantPgm+ ')'">
                {{program.grantPgmDesc}} ({{program.grantPgm}})
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Search Review Type</mat-label>
            <input matInput [matAutocomplete]="review" [(ngModel)]="searchPayloadData.reviewType"
              [disabled]="!reviewTypeList?.length"
              [placeholder]="reviewTypeList?.length ? 'Select a review type' : 'Select a program first'" />
            <button type="button" matSuffix mat-icon-button aria-label="Clear" (click)="clearAutoSelect('review')"
              [disabled]="!reviewTypeList?.length">
              <mat-icon>close</mat-icon>
            </button>
            <mat-icon matSuffix>search</mat-icon>
            <mat-autocomplete #review="matAutocomplete" panelClass="reporting-overlay">
              <mat-option *ngFor="let review of reviewTypeList"
                (onSelectionChange)="changeReviewName(review, $event)"
                [value]="review.rvwType">
                {{review.rvwType}}
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>

          <div class="reporting-search-actions">
            <mat-radio-group [(ngModel)]="searchPayloadData.allReviews">
              <mat-radio-button *ngFor="let item of assignmentType" [value]="item.value">{{item.status}}</mat-radio-button>
            </mat-radio-group>
            <button type="button" mat-flat-button class="reporting-search-btn" (click)="searchReporting()">Search</button>
          </div>
        </div>
      </mat-expansion-panel>
    </mat-accordion>

    <mat-card-content class="user-table-height" *ngIf="responseData?.filteredData?.length > 0">
      <table mat-table [dataSource]="responseData" class="tbl-width">
        <ng-container *ngFor="let disCol of columnsHeaders; let colIndex = index"
          matColumnDef="{{disCol.fieldName}}">
          <th mat-header-cell *matHeaderCellDef>{{disCol.headerName}}</th>
          <td mat-cell *matCellDef="let element">
            <span title="{{element[disCol.fieldName]}}" [innerHTML]="disCol.fieldName == 'createdByName' ?
            element[disCol.fieldName] + '<br>' : element[disCol.fieldName]"></span>
            <span *ngIf="disCol.fieldName == 'grantPgmDesc'" [innerHTML]="' ( ' + element.grantProgram + ' )'"></span>
            <span *ngIf="disCol.fieldName == 'createdByName'" [innerHTML]="element.createdDt | date:'MM/dd/yyyy HH:mm:ss aaa'"></span>
          </td>
        </ng-container>

        <ng-container matColumnDef="Action">
          <th mat-header-cell *matHeaderCellDef>Action</th>
          <td mat-cell *matCellDef="let element">
            <mat-icon class="cursor mr-10" title="Edit"
              (click)="openAddorEditReportingModule('edit', element)">edit</mat-icon>
            <mat-icon class="cursor" title="Download"
              (click)="downloadReportingData(element)">download</mat-icon>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr mat-row *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length">No Records Found</td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="[5, 10, 15, 20]" showFirstLastButtons
        [selectConfig]="paginatorSelectConfig"></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
