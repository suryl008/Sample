<div *ngIf="showSpinner" class="showSpinner">
    <mat-spinner [diameter]="50"></mat-spinner>
</div>
<div>
    <mat-card>
        <div class="row" style="display: flex;">
            <div class="col-lg-12">
                <mat-accordion class="example-headers-align" multi>
                    <mat-expansion-panel [expanded]="true">
                        <mat-expansion-panel-header #panelSearch class="mat-expansion-panel-header">
                            <mat-panel-title>
                                <div class="row" style="width: 100%;">
                                    <div class="col-lg-4">
                                        <span class="mat-panel-title-span">Search</span>
                                    </div>
                                </div>
                            </mat-panel-title>
                        </mat-expansion-panel-header>

                        <div class="row column-search mt-20">
                            <div class="col-lg-4">
                                <app-dropdown [dropdownListValue]="qusList" [selectedItemsValues]="selectedQus"
                                    [selectedText]="'Please Select Questionnaire'" [isMultiSelectDropdown]="false"
                                    (updatedSelectedValue)="updatedSelectedValue($event)"></app-dropdown>
                            </div>
                            <div class="col-lg-8">
                                <button class="btn-secondary mt-1 cursor" type="button" mat-stroked-button
                                    (click)="copyQuestionnaireData()"
                                    [title]="selectedQus?.length == 0 ? 'Please Select Questionnaire' : ''"
                                    [disabled]="selectedQus?.length == 0">
                                    <mat-icon class="mr-10" aria-hidden="true">add</mat-icon>
                                    <span class="mt-20">Copy</span>
                                </button>
                                <button class="btn-secondary mt-1 cursor" type="button" mat-stroked-button>
                                    <mat-icon class="mr-10" aria-hidden="true">add</mat-icon>
                                    <span class="mt-20">Add</span>
                                </button>
                                <button class="btn-primary" type="button" mat-flat-button
                                    [disabled]="selectedQus?.length == 0" (click)="getQuestionnaireData()">
                                    <mat-icon class="mr-20" aria-hidden="true">search</mat-icon>
                                    <span class="mt-20">Search</span>
                                </button>
                                <button class="btn-secondary mt-1 cursor" (click)="clearAll()" type="button"
                                    mat-stroked-button>
                                    <mat-icon class="mr-10" aria-hidden="true">cancel</mat-icon>
                                    <span class="mt-20">Clear</span>
                                </button>
                                <button class="btn-secondary mt-1 cursor" type="button" mat-stroked-button>
                                    <mat-icon class="mr-10" aria-hidden="true">visibility</mat-icon>
                                    <span class="mt-20">Preview</span>
                                </button>
                            </div>
                        </div>
                    </mat-expansion-panel>
                </mat-accordion>
            </div>
            <div class="row">
                <div class="col-lg-7">
                    <mat-radio-group class="radio-group" aria-label="Filter questionnaires by record status"
                        [(ngModel)]="status">
                        <mat-radio-button (change)="changeStatus(list)" class="mat-radio-button"
                            style="font-size: 12px; margin-right: 8x;" *ngFor="let list of statusList" [value]="list">
                            {{list}}
                        </mat-radio-button>
                    </mat-radio-group>
                </div>
                <div class="col-lg-4 text-end">
                    <mat-form-field appearance="outline">
                        <mat-label>Filter</mat-label>
                        <input autocomplete="off" id="search" matInput placeholder="Search columns"
                            (keyup)="applyFilter($event)" #input [(ngModel)]="searchFilter">
                    </mat-form-field>
                </div>
                <div *ngIf="dataSource?.data?.length > 50" class="col-lg-1 column-search mt-10 text-end">
                    <mat-form-field style="font-size: 12px" appearance="outline">
                        <mat-label>Items per page</mat-label>
                        <mat-select [(value)]="currentPageSize" (selectionChange)="onPageSizeChange($event)">
                            <mat-option *ngFor="let option of pageSizeOptionLabels"
                                [value]="option.value">{{option.label}}</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>
            <div class="col-lg-12">
                <mat-card-content class="mat-elevation-z8">
                    <div class="table-responsive">
                        <table #table mat-table matSort [matSortActive]="currentSort.active"
                            [matSortDirection]="currentSort.direction" (matSortChange)="sortData($event)"
                            [dataSource]="pagedData" class="tbl-width">
                            <ng-container *ngFor="let data of matColumnConfig; let i = index"
                                matColumnDef="{{data.id}}">
                                <th style="min-width: 60px;" mat-header-cell *matHeaderCellDef mat-sort-header
                                    [disabled]="!isSortableColumn(data.id)">
                                    {{data.name}}</th>
                                <td mat-cell *matCellDef="let element; let j = index">
                                    <button *ngIf="data.id == 'name'" type="button" class="questionnaire-name-link"
                                        [attr.aria-label]="'Open questionnaire ' + element[data.id]"
                                        (click)="redirectQusDetails(element)">{{element[data.id]}}</button>
                                    <span *ngIf="data.id != 'name'">{{element[data.id]}}</span>
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="download">
                                <th mat-header-cell *matHeaderCellDef>Download</th>
                                <td mat-cell *matCellDef="let element">
                                    <a> <mat-icon class="cursor me-2" style="font-size: 28px; color: #4CAF50;"
                                            title="Download" (click)="exportToExcel(element?.questionnaireCode)"
                                            aria-hidden="true">file_download</mat-icon></a>
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="preview">
                                <th mat-header-cell *matHeaderCellDef>Preview</th>
                                <td mat-cell *matCellDef="let element">
                                    <a> <mat-icon class="cursor me-2" style="font-size: 24px; color: #4CAF50;"
                                            title="Preview" (click)="previewQuestionnaire(element?.questionnaireCode)"
                                            aria-hidden="true">visibility</mat-icon></a>
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="actions">
                                <th mat-header-cell *matHeaderCellDef>Scripts</th>
                                <td mat-cell *matCellDef="let element">
                                    <a> <mat-icon class="cursor me-2" style="font-size: 28px; color: #4CAF50;"
                                            title="Questionnaire Scripts"
                                            [attr.aria-label]="'Questionnaire Scripts for ' + element.name"
                                            (click)="openQuestionnaireScripts(element)"
                                            aria-hidden="true">assignment</mat-icon></a>
                                </td>
                            </ng-container>
                            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                            <tr mat-row *matNoDataRow>
                                <td class="mat-cell" [attr.colspan]="displayedColumns.length"> No data matching the
                                    filter.</td>
                            </tr>
                        </table>
                    </div>
                    <mat-paginator [length]="dataSource?.data?.length"
                        [pageSize]="currentPageSize === 'all' ? dataSource?.data?.length : currentPageSize" #paginator
                        [pageSizeOptions]="[]" showFirstLastButtons (page)="onPageChange($event)"></mat-paginator>
                </mat-card-content>
            </div>
        </div>
    </mat-card>
</div>
