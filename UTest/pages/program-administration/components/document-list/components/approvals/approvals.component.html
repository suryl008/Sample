<form [formGroup]="approvalsForm">
   <div class="col-lg-12">

      <mat-form-field class="example-full-width col-lg-12" appearance="outline">
         <mat-label>Instructions</mat-label>
         <textarea formControlName="helpTxt" matInput placeholder="Enter instruction"></textarea>
      </mat-form-field>
   </div>
   <div class="col-lg-12">
      <mat-form-field appearance="outline" class="full-width">
         <mat-label>Email Template</mat-label>
         <mat-select formControlName="approvalEmailTemplateId">
            <mat-option style="color: rgb(9, 2, 2);" *ngFor="let email of emailTemplateList"
               [value]="email.emailTemplateId">
               {{ email.templateName }}
            </mat-option>
         </mat-select>
      </mat-form-field>
   </div>
   <div class="col-lg-12">
      <div class="row">
         <div class="col-lg-9">
            <label class="col-lg-6">Editable</label>
            <mat-slide-toggle [labelPosition]="myLabelPosition" formControlName="editableEmail">
            </mat-slide-toggle>
         </div>

      </div>
   </div>

   <div class="col-lg-12">
      <div class="col-lg-9">
         <label class="col-lg-6">Unlimited</label>
         <mat-slide-toggle [labelPosition]="myLabelPosition" formControlName="unlimitedRecipients">
         </mat-slide-toggle>
      </div>
   </div>
   <div class="col-lg-12">
      <mat-form-field appearance="outline" class="full-width">
         <mat-label>Import</mat-label>
         <mat-select formControlName="dataSrc">
            <mat-option style="color: rgb(9, 2, 2);" *ngFor="let docApprovalsImport of docApprovalsImportList"
               [value]="docApprovalsImport.item_id">
               {{ docApprovalsImport.item_text }}
            </mat-option>
         </mat-select>
      </mat-form-field>
   </div>
</form>
