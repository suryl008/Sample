<form [formGroup]="flexForm">
   <div class="col-lg-12">

      <mat-form-field class="example-full-width col-lg-12" appearance="outline">
         <mat-label>Instructions</mat-label>
         <textarea formControlName="helpTxt" matInput placeholder="Enter instruction"></textarea>
      </mat-form-field>
   </div>
   <div class="row">
      <div class="col-lg-12">
         <mat-form-field appearance="outline" class="full-width">
            <input matInput required [matAutocomplete]="auto" [formControl]="searchFlexformCtrl"
               placeholder="Min 3 Characters Ex. Ogs" />
            <button matSuffix mat-icon-button aria-label="Clear" (click)="clearSelection()">
               <mat-icon>close</mat-icon>
            </button>
            <div style="margin-bottom: -30px">
               <mat-icon style="margin-top: -2px" matSuffix></mat-icon>
            </div>
            <span matSuffix>
               <mat-icon matSuffix>search</mat-icon>
            </span>
            <mat-label>Select Enhanced FlexForm</mat-label>
            <mat-autocomplete [panelWidth]="670" #auto="matAutocomplete" [displayWith]="displayWith">
               <mat-option *ngIf="isLoading" class="is-loading">Loading...</mat-option>
               <ng-container *ngIf="!isLoading">
                  <mat-option (click)="OnSelect(flexFormVal)" *ngFor="let flexFormVal of filteredFlexform"
                     [value]="flexFormVal">
                     <span *ngIf="flexFormVal.formCode != null; else templateName"><b>{{flexFormVal.name}}</b>
                        ({{flexFormVal.formCode}})</span>
                     <ng-template #templateName>
                        <span><b>{{flexFormVal.name}}</b></span>
                     </ng-template>
                  </mat-option>
               </ng-container>
            </mat-autocomplete>
         </mat-form-field>
      </div>
   </div>
   <div class="col-lg-12">
      <div class="col-lg-9">
         <label class="col-lg-6">Allow multiple instance</label>
         <mat-slide-toggle formControlName="allowMultipleFlexformInstances">
         </mat-slide-toggle>
      </div>
   </div>
</form>
