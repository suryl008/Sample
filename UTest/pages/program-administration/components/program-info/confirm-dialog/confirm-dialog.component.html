<div style="padding:0" >
  <h1 mat-dialog-title>Are you sure?</h1>

  <mat-dialog-content style="border-top:1px solid #dddd;border-bottom:1px solid #dddd ">
   <div style="height: 70px; "><div style="margin-top:30px"> User
    <strong>{{data.fullName}}</strong> will be deleted</div>
  </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onConfirmClick()">Confirm</button>
    <button mat-button (click)="onCancelClick()">Cancel</button>
  </mat-dialog-actions>
</div>
