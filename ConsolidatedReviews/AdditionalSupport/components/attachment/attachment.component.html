<form [formGroup]="attachmentForm">
   <div id="f1_container">
      <div class="row">
         <div class="col-md-11 col-11"></div>
         <div class="col-lg-1 float-right" *ngIf="attachmentForm.controls['fileTypeAppl'].value">
            <mat-icon class="cursor" matTooltip="File Types" (click)="onClickFlip()" color="primary" matSuffix
               mat-icon-button>flip</mat-icon>
         </div>
      </div>
      <div id="f1_card1" [class.flipped]="isFlipped">
         <div class="front face">
            <div class="col-lg-12">
               <mat-form-field class="example-full-width col-lg-12" appearance="legacy">
                  <mat-label>Instructions</mat-label>
                  <textarea matInput formControlName="helpTxt" placeholder="Enter instruction"></textarea>
               </mat-form-field>
            </div>
            <div class="row">
               <div class="col-lg-3">
                  <mat-form-field class="example-full-width col-lg-12" appearance="legacy">
                     <mat-label>Minimum files</mat-label>
                     <input class="col-lg-12" matInput type="number" formControlName="minNos"
                        placeholder="Enter minimum files" />
                  </mat-form-field>
               </div>
               <div class="col-lg-3">
                  <mat-form-field class="example-full-width col-lg-12" appearance="legacy">
                     <mat-label>Maximum files</mat-label>
                     <input class="col-lg-12" matInput type="number" formControlName="maxNos"
                        placeholder="Enter maximum files" />
                  </mat-form-field>
               </div>
               <div class="col-lg-6">
                  <mat-label>File type applicability</mat-label>
                  <mat-slide-toggle formControlName="fileTypeAppl"></mat-slide-toggle>
               </div>
            </div>
         </div>
         <div class="back face">
            <div style="height: 200px; overflow-y: auto">
               <table mat-table [dataSource]="dataSourceReminder" style="width: 100%">
                  <ng-container matColumnDef="refType">
                     <th style="font-weight: 500; font-size: 14px; color: black; padding: 5px;" mat-header-cell
                        *matHeaderCellDef>File Type</th>
                     <td width="30" style="padding: 5px; font-size: 12px; text-align: left" mat-cell
                        *matCellDef="let element">
                        <span style="">{{element.refCode }} </span>
                     </td>
                  </ng-container>
                  <ng-container matColumnDef="refDesc">
                     <th mat-header-cell *matHeaderCellDef
                        style="font-weight: 500; font-size: 14px; color: black; padding: 5px;">Description</th>
                     <td mat-cell *matCellDef="let element" width="30"
                        style="padding: 5px; font-size: 12px; text-align: left"><span style="">{{ element.refDesc
                           }}</span>
                     </td>
                  </ng-container>

                  <ng-container matColumnDef="sel">
                     <th mat-header-cell *matHeaderCellDef
                        style="font-weight: 500; font-size: 14px; color: black; padding: 5px;">Sel</th>
                     <td width="30" style="padding: 5px; font-size: 12px; text-align: left" mat-cell
                        *matCellDef="let element">
                        <mat-slide-toggle [checked]="element.sel === true ? true : false"
                           (change)="element.sel = !element.sel" (click)="addFileType(element, 'select')"
                           [disabled]="!isDocModelEdit"></mat-slide-toggle>
                     </td>
                  </ng-container>

                  <ng-container matColumnDef="sizeApply">
                     <th mat-header-cell *matHeaderCellDef
                        style="font-weight: 500; font-size: 14px; color: black; padding: 5px;">Size Appl.</th>
                     <td width="30" style="padding: 5px; font-size: 12px; text-align: left" mat-cell
                        *matCellDef="let element">
                        <mat-slide-toggle [checked]="element.size_appl === true ? true : false"
                           (change)="element.size_appl = !element.size_appl" (click)="addFileType(element, 'size')"
                           [disabled]="!element.sel || !isDocModelEdit"></mat-slide-toggle>
                     </td>
                  </ng-container>

                  <ng-container matColumnDef="maxSize">
                     <th mat-header-cell *matHeaderCellDef
                        style="font-weight: 500; font-size: 14px; color: black; padding: 5px;">Max Size</th>
                     <td width="30" style="padding: 5px; font-size: 12px; text-align: left" mat-cell
                        *matCellDef="let element">
                        <input type="number" (input)="element.maximum_size = $any($event.target).value"
                           [disabled]="!element.sel || !isDocModelEdit" [value]="element.maximum_size"
                           (change)="updateFileType($event, element, 'maxSize')" />
                     </td>
                  </ng-container>
                  <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
                  <tr mat-row *matRowDef="let row; columns: columnsToDisplay" class="example-element-row"></tr>
               </table>
               <div class="row mt-3" *ngIf="isShowPDFPg">
                  <div style="text-align: left">
                     <div class="row" style="margin-bottom: 15px">
                        <label class="col-lg-2" style="margin-top: 15px; padding-left: 10px;">PDF</label>
                        <div class="col-lg-5" style="margin-top: 15px;">
                           <label class="col-lg-9" style="padding-left: 10px;">Page no applicability</label>
                           <mat-slide-toggle formControlName="pageAppl" style="padding-left: 40px;"
                              (change)="updatePDFFileInfo($event, 'pageAppl')"></mat-slide-toggle>
                        </div>
                        <div class="col-lg-5">
                           <div class="row">
                              <div class="col-lg-6">
                                 <mat-form-field class="example-full-width" appearance="legacy">
                                    <mat-label>Minimum Page no</mat-label>
                                    <input type="number" matInput placeholder="Enter minimum files"
                                       formControlName="minPg" [disabled]="!isDocModelEdit"
                                       (change)="updatePDFFileInfo($any($event.target).value, 'minPg')" />
                                 </mat-form-field>
                              </div>
                              <div class="col-lg-6">
                                 <mat-form-field class="example-full-width" appearance="legacy">
                                    <mat-label>Maximum Page no</mat-label>
                                    <input type="number" matInput placeholder="Enter maximum files"
                                       formControlName="maxPg" [disabled]="!isDocModelEdit"
                                       (change)="updatePDFFileInfo($any($event.target).value, 'maxPg')" />
                                 </mat-form-field>
                              </div>
                           </div>
                        </div>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>
</form>
