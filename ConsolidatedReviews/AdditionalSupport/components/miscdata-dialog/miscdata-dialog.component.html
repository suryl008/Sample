<div class="row p-1 bt-c ">
  <div class="col-lg-5 col-md-5 ">
    <h6>Add Meta Data</h6>
  </div>
  <div class="col-lg-7 col-md-7" style="display:flex;flex-direction:row-reverse">
    <button style="padding: 0;" (click)="isEdit=!isEdit;setColumn('edit')" *ngIf="!isEdit" class="mt-n1" mat-button
      color="primary">
      <mat-icon color="accent" class="ft-size">edit</mat-icon>Edit
    </button>
    <button style="padding: 0;" (click)="isEdit=!isEdit;setColumn('')" *ngIf="isEdit" class="mt-n1" mat-button
      color="primary">
      <mat-icon color="accent" class="ft-size">cancel</mat-icon>Cancel
    </button>
    <button style="padding: 0;" (click)="isEdit=!isEdit;editRow();setColumn('')" *ngIf="isEdit" class="mt-n1" mat-button
      color="primary">
      <mat-icon color="accent" class="ft-size">save</mat-icon>Update
    </button>
    <button style="padding: 0;" class="mt-n1" *ngIf="!isEdit" mat-button color="primary"
      (click)="addRow();isEdit=!isEdit;;setColumn('edit')">
      <mat-icon color="accent" class="ft-size">add</mat-icon>Add
    </button>
  </div>



</div>

<mat-dialog-content class="mat-typography">

  <table mat-table [dataSource]="dataSource" class="full-table">

    <ng-container [matColumnDef]="col.key" *ngFor="let col of columnsSchema">

      <!-- HEADER -->
      <th mat-header-cell *matHeaderCellDef>
        {{ col.label }}
      </th>

      <!-- CELL -->
      <td mat-cell *matCellDef="let element" [ngClass]="{ 'delete-col': col.type === 'isEdit' }">

        <!-- VIEW MODE -->
        <div *ngIf="!isEdit" [ngSwitch]="col.type">

          <!-- DELETE COLUMN -->
          <div class="btn-edit" *ngSwitchCase="'isEdit'">
            <button mat-button class="button-remove" (click)="removeRow(element.id)">
              <mat-icon class="ft-size">delete</mat-icon>
            </button>
          </div>

          <!-- NORMAL TEXT -->
          <span *ngSwitchDefault>
            {{ element[col.key] }}
          </span>

        </div>

        <!-- EDIT MODE -->
        <div *ngIf="isEdit && col.type !== 'isEdit'" class="edit-container">

          <!-- TEXTBOX (35%) -->
          <mat-form-field class="edit-textbox" *ngIf="col.label === 'Field Name'">

            <input matInput readonly [required]="col.required" [(ngModel)]="element[col.key]" />
          </mat-form-field>

          <!-- TEXTAREA (65%) -->
          <mat-form-field class="edit-textarea" *ngIf="col.label !== 'Field Name'">

            <textarea matInput [required]="col.required" [(ngModel)]="element[col.key]">
            </textarea>
          </mat-form-field>

        </div>

      </td>

    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  </table>

</mat-dialog-content>
