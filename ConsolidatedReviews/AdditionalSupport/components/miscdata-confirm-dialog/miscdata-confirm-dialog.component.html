<div class="ultra-thin-confirm-dialog">
  <div class="dialog-header">
    <mat-icon class="dialog-icon" color="warn">warning</mat-icon>
    <h1 mat-dialog-title class="dialog-title">Confirm Deletion</h1>
  </div>

  <div mat-dialog-content class="dialog-content">
    <p class="dialog-message">Are you sure you want to delete this item?</p>
    <p class="dialog-submessage">This action cannot be undone.</p>
  </div>

  <div mat-dialog-actions class="ultra-thin-dialog-actions">
    <button mat-button class="ultra-thin-cancel-btn" [mat-dialog-close]="false">
      Cancel
    </button>
    <button mat-button class="ultra-thin-delete-btn" [mat-dialog-close]="true">
      <mat-icon class="delete-icon">delete</mat-icon>
      Delete
    </button>
  </div>
</div>
